name: Update Regional Econ Data

on:
  schedule:
    # 매일 아침 9시 (KST)에 실행. (깃허브 서버는 UTC 기준이므로 한국 시간 - 9시간인 00:00으로 설정)
    - cron: '0 0 * * *'
  workflow_dispatch: 
    # (테스트용)

jobs:
  run-data-pipeline:
    runs-on: ubuntu-latest # 깃허브가 제공하는 우분투 리눅스 서버

    steps:
    - name: 1. 내 저장소 코드 불러오기
      uses: actions/checkout@v4

    - name: 2. 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.14.4' 

    - name: 3. 필요한 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        # requirements.txt 파일이 있다면 아래 명령어로 설치.
        pip install pandas requests python-dotenv

    - name: 4. 데이터 수집 스크립트 실행 (API 연동)
      #  깃허브 보안 비밀금고(Secrets)에서 키를 꺼내와서 환경변수에 넣기.
      env:
        ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      run: |
        python collector/collect.py 

    - name: 5. 수집된 데이터(또는 대시보드 HTML)를 깃허브에 자동 커밋 및 푸시
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add .
        
        # 데이터가 변경된 사항이 있을 때만 커밋하도록 처리하는 안전 장치
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: 일간 거시경제 데이터 수집 및 대시보드 갱신"
        
        # 메인 브랜치로 푸시하여 블로그(sungjin-dev.github.io)에 반영
        git push
