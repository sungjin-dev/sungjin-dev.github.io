<!-- _includes/mermaid-init.html
     Liquid 표현식을 전혀 쓰지 않는 정적 버전.
     (이전 버전의 {{ site.mermaid.version }} 조합이 jekyll-include-cache와
      충돌해 "stack level too deep" 빌드 실패를 일으켰음 — 버전은 하드코딩) -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  var isDark = function () {
    return document.documentElement.getAttribute("data-theme") === "dark";
  };

  var darkVars = {
    xyChart: {
      backgroundColor: "#1a1b26",
      titleColor: "#c0caf5",
      xAxisLabelColor: "#a9b1d6",
      xAxisTitleColor: "#c0caf5",
      xAxisTickColor: "#3b4261",
      xAxisLineColor: "#3b4261",
      yAxisLabelColor: "#a9b1d6",
      yAxisTitleColor: "#c0caf5",
      yAxisTickColor: "#3b4261",
      yAxisLineColor: "#3b4261",
      plotColorPalette: "#7dcfff,#e0af68,#bb9af7,#9ece6a,#f7768e"
    }
  };

  var config = function () {
    return {
      startOnLoad: false,
      securityLevel: "loose",
      theme: isDark() ? "dark" : "default",
      themeVariables: isDark() ? darkVars : {},
      flowchart: { htmlLabels: true }
    };
  };

  // 1) kramdown/rouge가 만드는 ```mermaid 코드펜스를
  //    <pre><code class="language-mermaid">...</code></pre> (또는 div.language-mermaid 래퍼) 로
  //    렌더링하므로, mermaid가 인식하는 <div class="mermaid"> 형태로 최초 1회 변환한다.
  function convertBlocks() {
    var raw = document.querySelectorAll(
      "div.language-mermaid, pre code.language-mermaid, code.language-mermaid"
    );
    raw.forEach(function (el) {
      var code = el.tagName === "CODE" ? el : el.querySelector("code");
      var text = code ? code.textContent : el.textContent;
      // 코드펜스 파싱 과정에서 앞뒤로 개행/공백이 섞여 들어오면
      // mermaid가 첫 줄에서 다이어그램 타입을 못 읽고
      // "No diagram type detected" 에러를 내므로 반드시 trim.
      text = text.trim();

      // 바깥 래퍼를 최대한 넓게 찾아서 통째로 교체
      // (div.language-mermaid > pre > code 구조든, pre > code.language-mermaid 구조든 모두 대응)
      var wrapper =
        el.closest("div.language-mermaid") ||
        el.closest("div.highlighter-rouge") ||
        el.closest("pre") ||
        el;

      var div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = text;

      wrapper.parentNode.replaceChild(div, wrapper);
    });
  }

  var blocks = [];

  function collectAndRender() {
    convertBlocks();

    // 변환 후 실제 .mermaid 블록들을 대상으로 소스를 보관 (테마 재렌더링용)
    blocks = document.querySelectorAll(".mermaid");
    blocks.forEach(function (el) {
      el.dataset.mermaidSrc = el.textContent;
    });

    render();
  }

  function render() {
    mermaid.initialize(config());
    blocks.forEach(function (el) {
      el.removeAttribute("data-processed");
      el.textContent = el.dataset.mermaidSrc;
    });
    mermaid.run({ nodes: blocks });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", collectAndRender);
  } else {
    collectAndRender();
  }

  new MutationObserver(function (muts) {
    for (var i = 0; i < muts.length; i++) {
      if (muts[i].attributeName === "data-theme") {
        render();
        break;
      }
    }
  }).observe(document.documentElement, { attributes: true });
</script>

<style>
  /* mermaid 다이어그램 여백/정렬 — 코드블록이 아닌 그림처럼 보이게 */
  .mermaid {
    display: flex;
    justify-content: center;
    margin: 24px 0;
    background: transparent;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
  }
</style>
