<!-- _includes/mermaid-init.html
     Liquid 표현식을 전혀 쓰지 않는 정적 버전.
     (이전 버전의 {{ site.mermaid.version }} 조합이 jekyll-include-cache와
      충돌해 "stack level too deep" 빌드 실패를 일으켰음 — 버전은 하드코딩) -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.0/dist/mermaid.esm.min.mjs";

  var isDark = function () {
    return document.documentElement.getAttribute("data-theme") === "dark";
  };

  var darkVars = {
    xyChart: {
      backgroundColor: "#1a1b26",
      titleColor: "#c0caf5",
      xAxisLabelColor: "#a9b1d6",
      xAxisTitleColor: "#c0caf5",
      xAxisTickColor: "#3b4261",
      xAxisLineColor: "#3b4261",
      yAxisLabelColor: "#a9b1d6",
      yAxisTitleColor: "#c0caf5",
      yAxisTickColor: "#3b4261",
      yAxisLineColor: "#3b4261",
      plotColorPalette: "#7dcfff,#e0af68,#bb9af7,#9ece6a,#f7768e"
    }
  };

  var config = function () {
    return {
      startOnLoad: false,
      securityLevel: "loose",
      theme: isDark() ? "dark" : "default",
      themeVariables: isDark() ? darkVars : {},
      flowchart: { htmlLabels: true }
    };
  };

  var blocks = document.querySelectorAll(".mermaid");
  blocks.forEach(function (el) {
    el.dataset.mermaidSrc = el.textContent;
  });

  function render() {
    mermaid.initialize(config());
    blocks.forEach(function (el) {
      el.removeAttribute("data-processed");
      el.textContent = el.dataset.mermaidSrc;
    });
    mermaid.run({ nodes: blocks });
  }

  render();

  new MutationObserver(function (muts) {
    for (var i = 0; i < muts.length; i++) {
      if (muts[i].attributeName === "data-theme") {
        render();
        break;
      }
    }
  }).observe(document.documentElement, { attributes: true });
</script>
