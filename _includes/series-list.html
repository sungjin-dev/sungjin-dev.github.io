<ul class="series-list">
  {% for s in site.data.series.list %}
  <li>
    <a class="series-row" href="{{ s.url | relative_url }}"{% if s.accent %} style="--series-accent: {{ s.accent }};"{% endif %}>
      <span class="series-name">{{ s.title }}</span>
      <span class="series-meta">{{ s.meta }}</span>
    </a>
  </li>
  {% endfor %}
</ul>
