<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보처리기사 실기 · 프로그래밍 언어 활용 코드 문제</title>
<style>
  :root{
    --paper:#ffffff;
    --ink:#16202b;
    --muted:#616b78;
    --rule:#dde2e8;
    --code-bg:#f5f7f9;
    --ok:#1c6b48;
    --ok-bg:#eaf4ef;
    --bad:#a63a2a;
    --bad-bg:#fbeeeb;
    --mark:#24506e;
    --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    --mono:'JetBrains Mono','D2Coding','SFMono-Regular',Consolas,'Nanum Gothic Coding',monospace;
    --hl-bg:#e4eef7;
    --hl-ink:#14486d;
    --hl-line:#c2d8e9;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#12161b; --ink:#e6eaef; --muted:#9aa5b1; --rule:#2b323a;
      --code-bg:#181d23; --ok:#63c295; --ok-bg:#16261f; --bad:#e08977; --bad-bg:#2a1b18;
      --mark:#8fb8d6;
      --hl-bg:#1d3040; --hl-ink:#bcdcf5; --hl-line:#2f4b60;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.75;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px; margin:0 auto; padding:28px 18px 80px}

  /* ── 답안지 머리글 ── */
  header{
    border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:8px;
  }
  header h1{font-size:22px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em}
  header p{margin:0; color:var(--muted); font-size:15px}

  .scorebar{
    position:sticky; top:0; z-index:5; background:var(--paper);
    display:flex; align-items:center; gap:12px;
    padding:10px 0 12px; border-bottom:1px solid var(--rule); margin-bottom:26px;
    font-size:14.5px; color:var(--muted);
  }
  .track{flex:1; height:4px; background:var(--rule); border-radius:2px; overflow:hidden}
  .track i{display:block; height:100%; width:0; background:var(--mark); transition:width .25s ease}
  .scorebar b{color:var(--ink); font-variant-numeric:tabular-nums}

  /* ── 단원 필터 ── */
  .filters{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 8px}
  #filters-source{margin-top:-8px}
  #filters-unit{margin-bottom:4px}
  .chip{
    font-family:inherit; font-size:13.5px; cursor:pointer;
    background:transparent; color:var(--muted);
    border:1px solid var(--rule); border-radius:14px; padding:3px 11px;
  }
  .chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}

  /* ── 문항 ── */
  .q{padding:22px 0 26px; border-bottom:1px solid var(--rule)}
  .qhead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px}
  .qno{font-family:var(--mono); font-size:14.5px; color:var(--mark); font-weight:700}
  .qtag{font-size:13.5px; color:var(--muted)}
  .qtag span{color:var(--ink)}
  .badge{
    font-size:12px; padding:1px 8px; border-radius:10px;
    border:1px solid var(--rule); color:var(--muted);
  }
  .badge.past{border-color:var(--mark); color:var(--mark)}
  .qtext{margin:0 0 14px; font-size:16px}

  pre.code{
    margin:0 0 14px; background:var(--code-bg); border:1px solid var(--rule);
    border-radius:6px; padding:18px 20px 18px 0; overflow-x:auto;
    font-family:var(--mono); font-size:14px; line-height:1.85; tab-size:4;
  }
  pre.code .ln{
    display:inline-block; width:46px; padding-right:16px; margin-right:16px;
    text-align:right; color:var(--muted); opacity:.65; border-right:1px solid var(--rule);
    user-select:none;
  }
  .stdin{
    margin:0 0 14px; font-size:14px; color:var(--muted);
    display:flex; gap:8px; align-items:flex-start;
  }
  .stdin code{font-family:var(--mono); font-size:13.5px; color:var(--ink); background:var(--code-bg);
    border:1px solid var(--rule); border-radius:3px; padding:1px 6px}

  /* ── 답안란 ── */
  .answer{position:relative}
  .answer label{display:block; font-size:14px; color:var(--muted); margin-bottom:6px}
  textarea{
    width:100%; min-height:72px; resize:vertical;
    font-family:var(--mono); font-size:15px; line-height:1.8; color:var(--ink);
    background:transparent; border:0; border-bottom:1px solid var(--ink);
    padding:6px 2px; outline:none; border-radius:0;
  }
  textarea:focus{border-bottom-width:2px; padding-bottom:5px}
  textarea:disabled{color:var(--muted)}
  .hintline{font-size:13.5px; color:var(--muted); margin-top:6px}

  .btns{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  button{
    font-family:inherit; font-size:14.5px; cursor:pointer;
    border:1px solid var(--ink); background:var(--ink); color:var(--paper);
    padding:7px 17px; border-radius:4px;
  }
  button.ghost{background:transparent; color:var(--ink); border-color:var(--rule)}
  button:focus-visible{outline:2px solid var(--mark); outline-offset:2px}
  button:disabled{opacity:.45; cursor:default}

  /* ── 개념 ── */
  .concept{
    margin-top:12px; background:var(--code-bg); border:1px solid var(--rule);
    border-radius:6px; padding:18px 20px; font-size:15px; line-height:1.8;
  }
  .concept h4{margin:0 0 10px; font-size:15px; font-weight:700; color:var(--mark)}
  .concept p{margin:0 0 8px}
  .concept p:last-child{margin-bottom:0}
  .concept ul{margin:0 0 10px; padding-left:20px}
  .concept li{margin:6px 0}
  .concept code, .explain code{
    font-family:var(--mono); font-size:13.5px; font-weight:500;
    background:var(--hl-bg); color:var(--hl-ink);
    border:1px solid var(--hl-line); border-radius:4px;
    padding:2px 6px; white-space:nowrap;
  }

  /* ── 메모 ── */
  .memo{margin-top:12px; border-left:2px solid var(--mark); padding:8px 0 4px 12px; border-radius:0}
  .memo label{display:block; font-size:13.5px; color:var(--muted); margin-bottom:4px}
  .memo textarea{min-height:60px; font-family:var(--sans); font-size:15px; border-bottom:1px dashed var(--rule)}
  button.has{border-color:var(--mark); color:var(--mark)}

  /* ── 채점 결과 ── */
  .verdict{margin-top:14px; border-radius:6px; padding:14px 16px; font-size:15px; display:none}
  .verdict.show{display:block}
  .verdict.ok{background:var(--ok-bg); border-left:3px solid var(--ok)}
  .verdict.bad{background:var(--bad-bg); border-left:3px solid var(--bad)}
  .verdict .mark{font-weight:700; margin-right:6px}
  .verdict.ok .mark{color:var(--ok)}
  .verdict.bad .mark{color:var(--bad)}
  .correct{
    margin:10px 0 0; font-family:var(--mono); font-size:14px; line-height:1.8; white-space:pre-wrap;
    background:var(--paper); border:1px solid var(--rule); border-radius:4px; padding:12px 14px;
  }
  .explain{margin:14px 0 0; font-size:15px; line-height:1.8}
  .explain ol{margin:6px 0 0; padding-left:20px}
  .explain li{margin:5px 0}


  footer{margin-top:28px; display:flex; flex-direction:column; gap:12px; align-items:flex-start}
  footer .total{font-size:15px; color:var(--muted)}
  footer .total b{color:var(--ink); font-size:19px; font-variant-numeric:tabular-nums}
  footer .btns{margin-top:0}
  #wrongonly[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
  .exportbox{width:100%; border-top:1px solid var(--rule); padding-top:14px}
  .exportbox p{margin:0 0 8px; font-size:14px; color:var(--muted)}
  .exportbox code{font-family:var(--mono); font-size:13.5px; color:var(--ink)}
  .exportbox pre{
    margin:0 0 10px; background:var(--code-bg); border:1px solid var(--rule); border-radius:4px;
    padding:10px 12px; overflow-x:auto; white-space:pre-wrap; word-break:break-all;
    font-family:var(--mono); font-size:13.5px; line-height:1.75;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>프로그래밍 언어 활용 · 코드 해석 연습</h1>
    <p>코드를 읽고 출력 결과를 직접 적어 본다. 줄바꿈과 공백은 자동으로 정규화되니 형태보다 값에 집중하면 된다.</p>
  </header>

  <div class="scorebar">
    <span>진행 <b id="done">0</b>/<b id="total">0</b></span>
    <div class="track"><i id="bar"></i></div>
    <span>정답 <b id="hit">0</b></span>
  </div>

  <div class="filters" id="filters-source"></div>
  <div class="filters" id="filters-lang"></div>
  <div class="filters" id="filters-unit"></div>

  <main id="list"></main>

  <footer>
    <div class="total" id="scoreline">아직 채점한 문항이 없다</div>
    <div class="btns">
      <button class="ghost" id="wrongonly" aria-pressed="false">오답만 보기</button>
      <button class="ghost" id="retrywrong">오답 다시 풀기</button>
      <button class="ghost" id="export">메모 내보내기</button>
      <button class="ghost" id="reset">전체 다시 풀기</button>
    </div>
    <div class="exportbox" id="exportbox" hidden>
      <p>아래 블록을 복사해 파일 안의 <code>const NOTES = { ... }</code> 자리에 통째로 바꿔 넣는다.</p>
      <pre id="exportcode"></pre>
      <button class="ghost" id="copy">복사</button>
    </div>
  </footer>
</div>

<script>
/* ─────────────────────────────────────────────
   1) 문제 데이터 — UI와 완전히 분리된 순수 데이터
      문항을 추가할 때는 이 배열에만 손대면 된다.
   ───────────────────────────────────────────── */
const PROBLEMS = [
  {
    id: "310-c-1",
    source: "기출",
    unit: "310 데이터 입출력",
    lang: "C",
    prompt: "다음 C 코드에 <code>3 4</code>를 입력했을 때 출력 결과를 쓰시오.",
    stdin: "3 4",
    code:
`#include <stdio.h>
main()
{
	int i, j, k;
	scanf("%d %d", &i, &j);
	k = i + j;
	printf("%d\\n", k);
}`,
    answers: ["7"],
    hint: "scanf의 서식 문자열에 있는 공백은 입력의 공백·개행을 건너뛰라는 뜻이다.",
    explain:
`<code>scanf("%d %d", &i, &j)</code>가 3과 4를 각각 i, j에 담고 k에 합을 저장한다.
<code>printf("%d\\n", k)</code>는 7을 찍고 줄을 바꾼다. 마지막 개행은 눈에 보이지 않으므로 답안에는 7만 적으면 된다.`
  },
  {
    id: "310-c-2",
    source: "기출",
    unit: "310 데이터 입출력",
    lang: "C",
    prompt: "다음 C 코드에 <code>10#10</code>을 입력했을 때 출력 결과를 쓰시오.",
    stdin: "10#10",
    code:
`#include <stdio.h>
main() {
	int i, j;
	scanf("%o#%x", &i, &j);
	printf("%d %d", i, j);
}`,
    answers: ["8 16"],
    hint: "%o와 %x가 입력을 몇 진수로 해석하는지 떠올려 본다.",
    explain:
`서식 문자열의 <code>#</code>는 변환 지정자가 아니라 그냥 글자다. 입력에 있는 <code>#</code>와 그대로 짝을 맞추는 구분자 역할만 한다.
<ol>
<li><code>%o</code>는 앞의 <code>10</code>을 8진수로 읽는다 → 8</li>
<li><code>%x</code>는 뒤의 <code>10</code>을 16진수로 읽는다 → 16</li>
<li><code>%d</code>로 출력하므로 둘 다 10진수로 바뀌어 <code>8 16</code>이 찍힌다</li>
</ol>
즉, 읽을 때의 진법과 쓸 때의 진법이 다르면 값이 그대로 유지되지 않는다.`
  },
  {
    id: "311-java-1",
    source: "기출",
    unit: "311 데이터 입출력",
    lang: "Java",
    prompt: "다음 Java 코드에 <code>3</code>과 <code>5</code>를 입력했을 때 출력 결과를 쓰시오.",
    stdin: "3 5",
    code:
`import java.util.Scanner;

public class Test {
	public static void main(String args[]) {
		Scanner scan = new Scanner(System.in);
		int a = scan.nextInt();
		int b = scan.nextInt();
		System.out.printf("%d", a + b);
		scan.close();
	}
}`,
    answers: ["8"],
    hint: "nextInt()는 공백과 개행을 구분자로 보고 정수 하나씩만 끊어 읽는다.",
    explain:
`<code>nextInt()</code>가 두 번 호출되면서 3과 5를 차례로 읽는다. <code>printf("%d", a + b)</code>는 개행 없이 8만 출력한다.
<code>scan.close()</code>는 자원을 닫는 코드라 출력에는 영향이 없다.`
  },
  {
    id: "311-java-2",
    source: "기출",
    unit: "311 데이터 입출력",
    lang: "Java",
    prompt: "다음 Java 코드에 <code>10</code>을 입력했을 때 출력 결과를 쓰시오.",
    stdin: "10",
    code:
`import java.util.Scanner;
public class Test
{
	public static void main(String[] args)
	{
		Scanner scan = new Scanner(System.in);
		int a = scan.nextInt();
		System.out.printf("a * 3 = %d\\n", a * 3);
		System.out.println("a / 2 = " + (a / 2));
		System.out.print("a - 1 = " + (a - 1));
		scan.close();
	}
}`,
    answers: ["a * 3 = 30\na / 2 = 5\na - 1 = 9"],
    hint: "정수끼리의 나눗셈에서 소수점 아래가 어떻게 되는지 확인한다.",
    explain:
`<ol>
<li><code>a * 3</code> → 30</li>
<li><code>a / 2</code>는 int끼리의 연산이라 결과도 int다. 5.0이 아니라 <b>5</b>다</li>
<li><code>a - 1</code> → 9</li>
</ol>
<code>printf</code>의 <code>\\n</code>과 <code>println</code>이 각각 줄을 바꾸므로 세 줄로 출력된다. 마지막은 <code>print</code>라 줄바꿈이 없다.`
  },
  {
    id: "316-c-1",
    source: "기출",
    unit: "316 연산자 우선순위",
    lang: "C",
    prompt: "다음 C 코드의 출력 결과를 쓰시오.",
    code:
`#include <stdio.h>
int main() {
	int x = 7, y = 4, z;
	z = y % 3 < 3 ? 2 : 1;
	z = z & z >> 1;
	z = x > 5 && z <= 3 ? z * x : z / x;
	printf("%d", z);
	return 0;
}`,
    answers: ["0"],
    hint: "시프트 연산자와 비트 AND 중 어느 쪽이 먼저 계산되는지가 갈림길이다.",
    explain:
`<ol>
<li><code>y % 3</code>은 1이고 <code>1 &lt; 3</code>은 참이므로 z는 2가 된다</li>
<li><code>z &amp; z &gt;&gt; 1</code>에서 시프트가 비트 AND보다 우선순위가 높다. 즉 <code>z &amp; (z &gt;&gt; 1)</code>이므로 <code>2 &amp; 1</code> = <code>10₂ &amp; 01₂</code> = 0</li>
<li><code>x &gt; 5</code>도 참, <code>z &lt;= 3</code>도 참이라 <code>z * x</code>가 선택되어 <code>0 * 7</code> = 0</li>
</ol>
물론 <code>(z &amp; z) &gt;&gt; 1</code>로 읽고 싶어질 수 있다. 하지만 그렇게 계산하면 z가 1이 되어 최종 결과가 7로 어긋난다. 이런 문제는 손으로 괄호를 먼저 쳐 놓고 푸는 것이 좋다.`
  },
  {
    id: "317-c-1",
    source: "기출",
    unit: "317 제어문",
    lang: "C",
    prompt: "다음 C 코드의 출력 결과를 쓰시오.",
    code:
`#include <stdio.h>
main() {
	int c = 1;
	switch (3) {
	case 1: c += 3;
	case 2: c++;
	case 3: c = 0;
	case 4: c += 3;
	case 5: c -= 10;
	default: c--;
	}
	printf("%d", c);
}`,
    answers: ["-8"],
    hint: "break가 하나도 없다는 점에 주목한다.",
    explain:
`<code>switch (3)</code>이므로 <code>case 3</code>에서 시작한다. break가 없어 아래 case들이 조건 검사 없이 줄줄이 실행된다. 이걸 폴스루(fall-through)라고 한다.
<ol>
<li><code>case 3</code> → c = 0</li>
<li><code>case 4</code> → c = 3</li>
<li><code>case 5</code> → c = -7</li>
<li><code>default</code> → c = -8</li>
</ol>
초기값 1은 <code>case 3</code>에서 덮어써지므로 아무 영향이 없다.`
  },
  {
    id: "317-c-2",
    source: "기출",
    unit: "317 제어문",
    lang: "C",
    prompt: "다음 C 코드의 출력 결과를 쓰시오.",
    code:
`#include <stdio.h>
int main(void) {
	char str[] = "REPUBLICOFKOREA";
	int a = 0;
	while (str[a] != '\\0')
		++a;
	putchar(str[a-2]);
	return 0;
}`,
    answers: ["E"],
    hint: "반복이 끝난 시점에 a가 가리키는 곳은 마지막 글자가 아니다.",
    explain:
`while문은 널 문자를 만날 때까지 a를 늘리므로, 끝나고 나면 a는 문자열 길이인 15가 된다. 즉 a는 마지막 글자 다음 칸을 가리킨다.
<code>str[14]</code>가 'A', <code>str[13]</code>이 'E'이므로 <code>str[a-2]</code>는 <b>E</b>다.
길이를 세는 반복문 뒤에서 인덱스를 쓸 때는 한 칸 밀린다는 점을 항상 확인하는 것이 좋다.`
  },
  {
    id: "317-c-3",
    source: "기출",
    unit: "317 제어문",
    lang: "C",
    prompt: "다음 C 코드의 출력 결과를 쓰시오.",
    code:
`#include <stdio.h>
main() {
	int score[] = { 86, 53, 95, 76, 61 };
	char grade;
	char str[] = "Rank";
	for (int i = 0; i < 5; i++) {
		switch (score[i] / 10) {
		case 10:
		case 9:
			grade = 'A';
			break;
		case 8:
			grade = 'B';
			break;
		case 7:
			grade = 'C';
			break;
		default: grade = 'F';
		}
		if (grade != 'F')
			printf("%d is %c %s\\n", i + 1, grade, str);
	}
}`,
    answers: ["1 is B Rank\n3 is A Rank\n4 is C Rank"],
    hint: "F 등급은 출력되지 않는다. 그리고 출력되는 번호는 인덱스가 아니라 i+1이다.",

	new_node -> value = value; new_node -> next = head; return new_node;

Data* reconnect(Data* head, int value) {
	if (head == NULL || head -> value == value) return head;
	Data *prev = NULL, *curr = head;
	while (curr != NULL && curr -> value != value) {
		prev = curr; curr = curr -> next;
	}
	if (curr != NULL && prev != NULL) {
		prev -> next = curr -> next; curr -> next = head; head = curr;
	}
	return head;

"346 열거형과 제네릭": `

"349 파이썬 중첩 자료구조": `

"310 데이터 입출력": `

<li><code>%d</code> 10진 정수 · <code>%o</code> 8진 · <code>%x</code> 16진 · <code>%f</code> 실수 · <code>%c</code> 문자 · <code>%s</code> 문자열</li>

</ul>

"311 데이터 입출력": `

<li><code>print</code>는 줄바꿈 없음 · <code>println</code>은 출력 후 줄바꿈 · <code>printf</code>는 서식대로 출력하고 줄바꿈 없음</li>

<p>출력이 몇 줄인지 세는 문제가 자주 나온다. 마지막이 <code>print</code>면 줄바꿈이 없다는 점까지 답에 반영해야 한다.</p>`,

"316 연산자 우선순위": `
<p>우선순위는 높은 것부터 낮은 순으로 이렇게 묶어 외우면 실수가 준다.</p>
<ul>
<li>단항(<code>!</code> <code>~</code> <code>++</code> <code>--</code>) → 산술(<code>* / %</code> → <code>+ -</code>) → 시프트(<code>&lt;&lt; &gt;&gt;</code>) → 관계(<code>&lt; &gt; &lt;= &gt;=</code> → <code>== !=</code>) → 비트(<code>&amp;</code> → <code>^</code> → <code>|</code>) → 논리(<code>&amp;&amp;</code> → <code>||</code>) → 삼항 → 대입</li>
<li>가장 잘 걸리는 함정이 <b>시프트가 비트 연산보다 먼저</b>라는 점이다. <code>z &amp; z &gt;&gt; 1</code>은 <code>z &amp; (z &gt;&gt; 1)</code>이다</li>
<li>비트 연산은 2진수로 바꿔서 자리마다 계산한다. <code>&amp;</code>는 둘 다 1일 때, <code>|</code>는 하나라도 1일 때, <code>^</code>는 서로 다를 때 1</li>
<li><code>&gt;&gt; 1</code>은 2로 나눈 몫, <code>&lt;&lt; 1</code>은 2배와 같다</li>
</ul>
<p>대입은 오른쪽에서 왼쪽으로 결합한다. 삼항 연산자가 중첩되면 뒤쪽부터 묶인다.</p>`,

"317 제어문": `
<p>C의 분기와 반복에서 출제 비중이 가장 높은 것은 switch의 폴스루다.</p>
<ul>
<li><code>switch</code>의 조건에는 정수와 문자만 올 수 있다. 실수와 문자열은 불가</li>
<li><code>break</code>가 없으면 일치한 case부터 아래 case들이 <b>조건 검사 없이 그대로 실행</b>된다. 이를 폴스루라고 한다</li>
<li><code>default</code>는 어디에 두어도 되고, 폴스루로 도달할 수도 있다</li>
<li><code>while</code>은 조건을 먼저 검사하고, <code>do-while</code>은 최소 한 번은 실행한다</li>
<li>문자열은 끝에 널 문자 <code>'\\0'</code>가 붙는다. 길이를 세는 반복문이 끝나면 인덱스는 마지막 글자보다 한 칸 뒤에 있다</li>
</ul>
<p>case가 값 없이 붙어 있는 형태(<code>case 10: case 9:</code>)는 두 값을 같은 처리로 묶는 관용적 표현이다.</p>`,

"318 제어문": `
<p>Java의 반복문은 형태가 두 가지이고, 배열을 다루는 방식이 다르다.</p>
<ul>
<li>일반 <code>for</code>는 초기식, 조건식, 증감식 세 부분이며 <code>for (j = 0, i = 0; ...)</code>처럼 쉼표로 여러 개를 둘 수 있다</li>
<li>향상된 for(<code>for (int p : x)</code>)는 배열의 <b>값</b>을 순서대로 꺼내며 인덱스를 쓰지 않는다</li>
<li>배열 길이는 <code>배열.length</code>(괄호 없음), 문자열 길이는 <code>문자열.length()</code>(괄호 있음)</li>
<li><code>charAt(i)</code>는 문자열에서 i번째 글자를 꺼낸다</li>
</ul>
<p>반복문 밖에서 선언한 변수는 반복이 끝난 뒤에도 값이 남는다. 그 값이 다음 반복문의 시작점이 되는 문제가 자주 나온다.</p>`,

"319 break와 continue": `
<p>두 명령은 반복문의 흐름을 바꾸지만 방향이 다르다.</p>
<ul>
<li><code>break</code>는 반복문을 즉시 빠져나온다. switch 안에서는 switch를 빠져나온다</li>
<li><code>continue</code>는 아래 문장을 건너뛰고 조건 검사로 돌아간다. 반복이 끝나지는 않는다</li>
<li>중첩된 반복문에서는 자기가 속한 <b>가장 안쪽 하나</b>에만 적용된다</li>
<li><code>while (1)</code>이나 <code>while (true)</code>는 그 자체로 끝나지 않는 반복이고, 탈출은 오직 <code>break</code>가 담당한다</li>
</ul>
<p><code>continue</code> 문제는 증감식의 위치가 관건이다. 증감이 continue보다 뒤에 있으면 값이 갱신되지 않아 무한 루프가 된다.</p>`,

"320 포인터": `
<p>포인터는 값이 아니라 주소를 담는 변수다. 표기가 여러 가지라 같은 뜻을 알아보는 것이 핵심이다.</p>
<ul>
<li><code>&amp;a</code>는 a의 주소, <code>*p</code>는 p가 가리키는 곳의 값</li>
<li>배열 이름은 첫 원소의 주소다. 따라서 <code>a[i]</code>, <code>*(a + i)</code>, <code>*a</code>(i가 0일 때)는 모두 같은 칸을 가리킨다</li>
<li>포인터에 1을 더하면 1바이트가 아니라 <b>가리키는 자료형 크기</b>만큼 이동한다</li>
<li><code>char *s = "abc"</code>에서 s는 문자열의 시작 주소다. <code>%s</code>에 <code>s + i</code>를 넘기면 그 위치부터 끝까지 출력된다</li>
<li>포인터가 가리키는 값을 바꾸면 원본 변수도 함께 바뀐다</li>
</ul>
<p>같은 값을 세 가지 표기로 섞어 쓰는 문제가 많으니, 문제를 풀 때 배열 그림을 그려 두는 편이 빠르다.</p>`,

"321 구조체": `
<p>구조체는 자료형이 다른 값을 하나로 묶는 사용자 정의 자료형이다.</p>
<ul>
<li>멤버 접근은 변수면 <code>.</code>, 포인터면 <code>-&gt;</code>를 쓴다. <code>p-&gt;a</code>는 <code>(*p).a</code>와 같다</li>
<li>구조체 배열의 초기화 값은 멤버 순서대로 차례차례 채워진다</li>
<li>일부 멤버만 초기화하면 나머지는 <b>0으로 채워진다</b></li>
<li>구조체 포인터에 <code>+1</code>을 하면 구조체 하나만큼 건너뛴다. 즉 <code>p + 1</code>은 다음 배열 원소다</li>
</ul>
<p><code>(p + 1)-&gt;os</code>처럼 괄호가 붙은 형태가 자주 나온다. <code>p + 1</code>이 몇 번째 원소인지 먼저 적어 두고 계산하면 헷갈리지 않는다.</p>`,

"322 사용자 정의 함수": `
<p>함수는 반환형, 이름, 매개변수로 이루어진다. 인수를 넘기는 방식이 결과를 가른다.</p>
<ul>
<li>값 호출은 값을 복사하므로 함수 안에서 바꿔도 원본은 그대로다</li>
<li>주소 호출은 주소를 넘기므로 함수 안의 변경이 원본에 반영된다. <b>배열은 항상 주소로 전달</b>된다</li>
<li>재귀 함수는 종료 조건이 반드시 있어야 한다. 조건까지 내려간 뒤 되짚어 올라오며 계산된다</li>
<li>함수 포인터는 <code>int (*pf)(int)</code> 형태다. 괄호가 없는 <code>int *pf(int)</code>는 포인터를 반환하는 함수 선언이라 뜻이 전혀 다르다</li>
</ul>
<p>정렬 코드가 나오면 대개 버블 정렬이다. 이웃한 두 값을 비교해 큰 값을 뒤로 넘기고, 한 회전마다 뒤쪽 한 칸이 확정된다.</p>`,

"323 Java의 클래스": `
<p>클래스는 설계도, 객체는 그것으로 만든 실체다. 변수의 종류를 구분하는 것이 출제 핵심이다.</p>
<ul>
<li>인스턴스 변수는 객체마다 따로 생기고, <code>static</code> 변수는 클래스에 <b>하나만</b> 존재해 모든 객체가 공유한다</li>
<li>static 변수는 <code>클래스명.변수</code>로 접근하는 것이 원칙이지만 <code>객체명.변수</code>로 써도 같은 저장 공간이다</li>
<li>객체를 메소드에 넘기면 참조가 전달되어 메소드 안의 변경이 원본에 남는다. 기본형은 값만 복사된다</li>
<li>후위 증가 <code>b++</code>는 <b>쓰고 나서 올리고</b>, 전위 증가 <code>++b</code>는 올리고 나서 쓴다</li>
</ul>
<p>메소드 안의 지역 변수는 이름이 같아도 클래스의 변수와 별개다. 둘을 섞어 놓고 값을 묻는 문제가 자주 나온다.</p>`,

"324 상속과 오버라이딩": `
<p>상속은 <code>extends</code>로 하고, 부모에 접근할 때는 <code>super</code>를 쓴다.</p>
<ul>
<li><code>super(값)</code>은 부모 생성자 호출이고 자식 생성자의 첫 줄에 와야 한다. <code>super.메소드()</code>는 부모의 메소드 호출이다</li>
<li>오버라이딩은 부모의 메소드를 <b>같은 형태로 다시 정의</b>하는 것, 오버로딩은 <b>같은 이름에 매개변수만 다르게</b> 여러 개 두는 것이다</li>
<li>부모 타입 변수에 자식 객체를 담으면(업캐스팅), 인스턴스 메소드는 <b>실제 객체</b>의 것이 실행된다</li>
<li>반면 <code>static</code> 메소드와 필드는 오버라이딩되지 않아 <b>참조 변수의 타입</b>으로 결정된다</li>
</ul>
<p>객체 생성 시 부모 생성자가 먼저 실행되고 자식 생성자가 뒤따른다. 생성자 안의 출력문도 답에 포함된다.</p>`,

"326 추상 클래스": `
<p>추상 클래스는 미완성 설계도다. 자식이 나머지를 채워야 쓸 수 있다.</p>
<ul>
<li><code>abstract</code> 메소드는 본체 없이 선언만 있고, 이를 가진 클래스는 <code>abstract class</code>가 된다</li>
<li>추상 클래스는 <b>객체를 직접 만들 수 없다</b>. 자식 객체를 부모 타입 변수에 담아 쓴다</li>
<li>자식은 추상 메소드를 반드시 구현해야 한다. 일반 메소드는 그대로 물려받는다</li>
<li>부모 타입 변수로는 <b>부모에 선언된 메소드만</b> 부를 수 있다. 자식에만 있는 메소드는 호출 대상이 아니다</li>
</ul>
<p>같은 이름의 메소드가 여러 개면 넘긴 인수의 개수와 자료형으로 어느 것이 불리는지 먼저 가려야 한다. 필드는 오버라이딩되지 않고 부모와 자식이 따로 갖는다는 점도 자주 나온다.</p>`,

"327 Python의 활용": `
<p>리스트는 순서가 있고 값을 바꿀 수 있는 자료형이다. 인덱스 처리가 출제 핵심이다.</p>
<ul>
<li>인덱스는 0부터 시작하고, 음수는 뒤에서부터 센다. <code>a[-1]</code>이 마지막 원소다</li>
<li><code>append(값)</code> 끝에 추가 · <code>insert(위치, 값)</code> 중간 삽입 · <code>remove(값)</code> 값으로 삭제 · <code>pop(위치)</code> 꺼내며 삭제</li>
<li><code>remove</code>로 원소가 빠지면 <b>뒤쪽 인덱스가 한 칸씩 당겨진다</b></li>
<li><code>input().split('-')</code>은 입력을 구분자로 잘라 여러 변수에 나눠 담는다</li>
<li><code>print(a, b, sep=',')</code>은 항목 사이 구분자를, <code>end=' '</code>는 줄 끝 문자를 바꾼다</li>
</ul>
<p>print에 값을 쉼표로 나열하면 기본적으로 사이에 공백이 하나 들어간다. 답을 적을 때 이 공백까지 세야 한다.</p>`,

"328 Python의 활용2": `
<p>세트는 중복이 없고 순서도 없는 자료형이다. 문자열 서식도 이 단원에서 함께 나온다.</p>
<ul>
<li><code>add(값)</code>은 하나를, <code>update({...})</code>는 여러 개를 한 번에 넣는다. 이미 있는 값은 그냥 무시된다</li>
<li><code>remove</code>는 없는 값을 지우면 오류, <code>discard</code>는 조용히 넘어간다</li>
<li>집합 연산은 <code>&amp;</code> 교집합 · <code>|</code> 합집합 · <code>-</code> 차집합 · <code>^</code> 대칭차집합</li>
<li>세트는 순서를 보장하지 않아 출력 순서가 실행할 때마다 달라질 수 있다. 답은 원소 구성으로 본다</li>
<li>문자열은 <code>"%s" % 값</code> 형태로 서식을 채운다</li>
</ul>
<p>슬라이싱과 섞여 나오면 인덱스를 번호와 함께 적어 두고 세는 편이 정확하다. 공백도 한 글자로 센다.</p>`,

"329 람다 식": `
<p>람다는 이름 없는 한 줄짜리 함수다. 다른 함수의 인수로 넘길 때 주로 쓴다.</p>
<ul>
<li>형태는 <code>lambda 매개변수 : 반환할 식</code>이며 return을 쓰지 않는다</li>
<li><code>map(함수, 반복자료)</code>는 모든 원소에 함수를 적용하고, <code>filter(함수, 반복자료)</code>는 조건에 맞는 것만 남긴다</li>
<li>map과 filter의 결과는 그대로 출력하면 내용이 보이지 않는다. <code>list()</code>로 감싸야 리스트가 된다</li>
<li>정렬 기준으로도 쓴다. <code>sorted(a, key=lambda x : x[1])</code></li>
</ul>
<p>리스트를 <code>print</code>에 그대로 넘기면 대괄호와 쉼표까지 함께 출력된다. 답안에 <code>[101, 102]</code> 형태를 그대로 적어야 한다.</p>`,

"330 Python의 클래스": `
<p>파이썬 클래스는 메소드의 첫 매개변수 자리에 객체 자신이 들어간다.</p>
<ul>
<li>관례상 <code>self</code>라고 쓰지만 이름은 자유다. 이름이 <code>sel</code>이어도 역할은 같다</li>
<li>메소드를 <code>객체.메소드(값)</code>으로 부르면 첫 매개변수는 자동으로 채워지므로 값은 두 번째 자리부터 들어간다</li>
<li><code>self.변수</code>는 객체에 속한 값, 클래스 본문에 바로 쓴 변수는 클래스 변수다</li>
<li><code>__init__</code>은 객체가 만들어질 때 자동으로 실행되는 생성자다</li>
</ul>
<p>두 값을 맞바꾸는 코드는 임시 변수가 있어야 한다. 임시 변수 없이 순서대로 대입하면 먼저 덮어쓴 값이 사라진다.</p>`,

"331 클래스 없는 메소드": `
<p>함수는 <code>def</code>로 정의한다. 매개변수 처리 방식이 출제 지점이다.</p>
<ul>
<li>기본값 매개변수(<code>def f(a, b = 2)</code>)는 값을 넘기지 않으면 기본값이 쓰인다. 기본값이 있는 것은 뒤쪽에 와야 한다</li>
<li><code>return a, b</code>처럼 여러 값을 돌려주면 튜플로 묶여 나온다</li>
<li>숫자와 문자열은 함수 안에서 바꿔도 밖의 변수에 영향이 없다. 리스트는 영향이 있다</li>
<li><code>/</code>는 나누어떨어져도 <b>실수</b>를 돌려준다. 몫만 필요하면 <code>//</code>를 쓴다</li>
</ul>
<p>따라서 <code>12 / 3</code>의 결과는 4가 아니라 <code>4.0</code>이다. C나 Java와 정반대라 언어를 섞어 풀 때 가장 많이 틀리는 지점이다.</p>`,

"332 Python Range": `
<p>range는 연속된 정수를 만들어 주는 함수다. 끝값을 포함하지 않는 것이 규칙이다.</p>
<ul>
<li><code>range(끝)</code>은 0부터, <code>range(시작, 끝)</code>은 시작부터, <code>range(시작, 끝, 증가)</code>는 간격을 지정한다</li>
<li>어느 형태든 <b>끝값 직전까지</b>다. <code>range(1, 3)</code>은 1과 2뿐이다</li>
<li>증가값이 음수면 거꾸로 센다. <code>range(5, 0, -1)</code>은 5부터 1까지</li>
<li>반복문 안에서 <code>=</code>로 대입하면 이전 값이 남지 않는다. 누적하려면 <code>+=</code>를 써야 한다</li>
</ul>
<p>시프트 연산과 섞여 나오는 경우가 많다. <code>&gt;&gt; 1</code>은 2로 나눈 몫, <code>&gt;&gt; 2</code>는 4로 나눈 몫으로 계산하면 빠르다.</p>`,

"333 Python 슬라이스": `
<p>슬라이싱은 문자열이나 리스트의 일부를 잘라내는 문법이다.</p>
<ul>
<li>형태는 <code>[시작 : 끝 : 증가]</code>이며 <b>끝 인덱스는 포함되지 않는다</b></li>
<li>시작을 생략하면 처음부터, 끝을 생략하면 마지막까지다. <code>[:3]</code>은 앞 세 개, <code>[3:]</code>은 네 번째부터 끝까지</li>
<li>음수는 뒤에서 센다. <code>[-3:]</code>은 마지막 세 개, <code>[:-3]</code>은 마지막 세 개를 뺀 나머지</li>
<li><code>[::-1]</code>은 순서를 뒤집는다</li>
</ul>
<p>인덱스 번호를 글자 위에 직접 적어 놓고 세는 것이 가장 확실하다. 공백도 한 글자로 센다.</p>`,

"335 세트·딕셔너리 메소드": `
<p>딕셔너리는 키와 값의 쌍으로 저장하는 자료형이다. 세트와 함께 묶여 출제된다.</p>
<ul>
<li><code>keys()</code> 키 목록 · <code>values()</code> 값 목록 · <code>items()</code> 쌍 목록 · <code>get(키)</code> 값 조회</li>
<li>없는 키에 값을 대입하면 새로 추가되고, 있는 키면 값이 바뀐다</li>
<li>컴프리헨션 <code>{i : i * 2 for i in lst}</code>는 반복문을 한 줄로 줄여 딕셔너리를 만든다</li>
<li><code>set(dst.values())</code>는 <b>그 시점의 값을 복사</b>한 별개의 집합이다. 이후 원본을 고쳐도 따라 바뀌지 않는다</li>
</ul>
<p>복사 시점과 변경 시점의 순서를 코드 줄 순서대로 표에 적으며 따라가면 실수가 줄어든다.</p>`
};

/* ─────────────────────────────────────────────
   2) 채점 엔진 — 정답 비교 규칙만 담당
   ───────────────────────────────────────────── */
function normalize(text){
  const lines = String(text).replace(/\r/g, "").split("\n")
    .map(l => l.trim().replace(/\s+/g, " "));
  while (lines.length && lines[0] === "") lines.shift();
  while (lines.length && lines[lines.length - 1] === "") lines.pop();
  return lines.join("\n");
}
function grade(input, answers){
  const mine = normalize(input);
  if (mine === "") return null;                 // 빈 답안은 채점하지 않는다
  return answers.some(a => normalize(a) === mine);
}

/* ─────────────────────────────────────────────
   3) 화면 렌더 — 데이터를 받아 DOM만 그린다
   ───────────────────────────────────────────── */
const state = new Map();   // id -> true(정답) | false(오답)
const notes = new Map();   // id -> 내 메모 문자열

function escapeHtml(s){
  return s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
}
function renderCode(src){
  return src.split("\n")
    .map((line, i) => `<span class="ln">${i + 1}</span>${escapeHtml(line)}`)
    .join("\n");
}

const list = document.getElementById("list");

PROBLEMS.forEach((p, idx) => {
  const sec = document.createElement("section");
  sec.className = "q";
  sec.dataset.unit = p.unit;
  sec.dataset.lang = p.lang;
  sec.dataset.source = p.source;
  sec.innerHTML = `
    <div class="qhead">
      <span class="qno">${String(idx + 1).padStart(2, "0")}</span>
      <span class="qtag"><span>${p.lang}</span> · ${p.unit}</span>
      <span class="badge ${p.source === "기출" ? "past" : ""}">${p.source}</span>
    </div>
    <p class="qtext">${p.prompt}</p>
    <pre class="code">${renderCode(p.code)}</pre>
    ${p.stdin ? `<p class="stdin">입력값 <code>${escapeHtml(p.stdin)}</code></p>` : ""}
    <div class="answer">
      <label for="ta-${p.id}">답안 (줄바꿈이 있으면 그대로 여러 줄로 적는다)</label>
      <textarea id="ta-${p.id}" spellcheck="false" autocomplete="off"></textarea>
      <p class="hintline" data-role="hint"></p>
    </div>
    <div class="btns">
      <button data-act="check">채점</button>
      <button class="ghost" data-act="hint">힌트</button>
      <button class="ghost" data-act="memo">메모</button>
      <button class="ghost" data-act="retry" disabled>다시 풀기</button>
      <button class="ghost" data-act="concept">개념</button>
    </div>
    <div class="concept" data-role="concept" hidden>
      <h4>${escapeHtml(p.unit)} 짚고 가기</h4>
      ${p.concept || CONCEPTS[p.unit] || "<p>정리된 개념이 아직 없다.</p>"}
    </div>
    <div class="memo" data-role="memo" hidden>
      <label for="me-${p.id}">내 메모 — 깨달은 점, 헷갈린 이유, 다음에 볼 것</label>
      <textarea id="me-${p.id}" data-role="memo-input" spellcheck="false"></textarea>
    </div>
    <div class="verdict" data-role="verdict"></div>
  `;
  list.appendChild(sec);
  sec.dataset.id = p.id;

  const ta      = sec.querySelector("textarea");
  const verdict = sec.querySelector('[data-role="verdict"]');
  const hintEl  = sec.querySelector('[data-role="hint"]');
  const btnCheck= sec.querySelector('[data-act="check"]');
  const btnHint = sec.querySelector('[data-act="hint"]');
  const btnMemo = sec.querySelector('[data-act="memo"]');
  const btnRetry= sec.querySelector('[data-act="retry"]');
  const memoBox = sec.querySelector('[data-role="memo"]');
  const memoTa  = sec.querySelector('[data-role="memo-input"]');

  notes.set(p.id, NOTES[p.id] || "");
  memoTa.value = notes.get(p.id);
  function markMemo(){
    const has = notes.get(p.id).trim() !== "";
    btnMemo.textContent = has ? "메모 ●" : "메모";
    btnMemo.classList.toggle("has", has);
  }
  markMemo();
  if (notes.get(p.id)) memoBox.hidden = false;

  memoTa.addEventListener("input", () => {
    notes.set(p.id, memoTa.value);
    markMemo();
  });
  btnMemo.addEventListener("click", () => {
    memoBox.hidden = !memoBox.hidden;
    if (!memoBox.hidden) memoTa.focus();
  });

  const conceptBox = sec.querySelector('[data-role="concept"]');
  sec.querySelector('[data-act="concept"]').addEventListener("click", () => {
    conceptBox.hidden = !conceptBox.hidden;
  });

  function check(){
    const result = grade(ta.value, p.answers);
    if (result === null){
      verdict.className = "verdict show bad";
      verdict.innerHTML = `<span class="mark">미입력</span>답안을 적은 뒤 채점한다.`;
      return;
    }
    state.set(p.id, result);
    ta.disabled = true;
    btnCheck.disabled = true;
    btnHint.disabled = true;
    btnRetry.disabled = false;
    verdict.className = "verdict show " + (result ? "ok" : "bad");
    verdict.innerHTML =
      `<span class="mark">${result ? "정답" : "오답"}</span>` +
      (result ? "" : "정답은 아래와 같다.") +
      `<div class="correct">${escapeHtml(p.answers[0])}</div>` +
      `<div class="explain">${p.explain}</div>`;
    updateScore();
  }
  function retry(){
    state.delete(p.id);
    ta.value = ""; ta.disabled = false;
    btnCheck.disabled = false; btnHint.disabled = false; btnRetry.disabled = true;
    verdict.className = "verdict"; verdict.innerHTML = "";
    hintEl.textContent = "";
    updateScore();
    ta.focus();
  }

  btnCheck.addEventListener("click", check);
  btnRetry.addEventListener("click", retry);
  btnHint.addEventListener("click", () => { hintEl.textContent = p.hint; });
  ta.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") check();
  });
});

function updateScore(){
  const done = state.size;
  const hit  = [...state.values()].filter(Boolean).length;
  document.getElementById("done").textContent = done;
  document.getElementById("hit").textContent  = hit;
  document.getElementById("bar").style.width  = (done / PROBLEMS.length * 100) + "%";

  const line = document.getElementById("scoreline");
  if (done === 0){
    line.textContent = "아직 채점한 문항이 없다";
  } else {
    const rate = Math.round(hit / done * 100);
    line.innerHTML = `${PROBLEMS.length}문항 중 <b>${done}</b>문항 채점 · `
      + `정답 <b>${hit}</b> · 오답 <b>${done - hit}</b> · 정답률 <b>${rate}</b>%`;
  }
}
document.getElementById("total").textContent = PROBLEMS.length;
updateScore();

/* ─────────────────────────────────────────────
   5) 오답 관리와 메모 내보내기
   ───────────────────────────────────────────── */
const wrongSet = new Set();   // "오답만 보기"를 켠 시점의 오답 목록

const btnWrong = document.getElementById("wrongonly");
btnWrong.addEventListener("click", () => {
  const on = btnWrong.getAttribute("aria-pressed") !== "true";
  wrongSet.clear();
  if (on) state.forEach((ok, id) => { if (!ok) wrongSet.add(id); });
  btnWrong.setAttribute("aria-pressed", String(on));
  pick.wrong = on;
  applyFilter();
  if (on && wrongSet.size === 0) alert("아직 오답으로 기록된 문항이 없다.");
});

document.getElementById("retrywrong").addEventListener("click", () => {
  const ids = [...state.entries()].filter(([, ok]) => !ok).map(([id]) => id);
  if (ids.length === 0){ alert("다시 풀 오답이 없다."); return; }
  ids.forEach(id => wrongSet.add(id));
  ids.forEach(id => {
    const sec = document.querySelector(`.q[data-id="${id}"]`);
    const btn = sec && sec.querySelector('[data-act="retry"]');
    if (btn && !btn.disabled) btn.click();
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
});

document.getElementById("export").addEventListener("click", () => {
  const box  = document.getElementById("exportbox");
  const code = document.getElementById("exportcode");
  const lines = [];
  PROBLEMS.forEach(p => {
    const v = (notes.get(p.id) || "").trim();
    if (v) lines.push(`  ${JSON.stringify(p.id)}: ${JSON.stringify(v)},`);
  });
  code.textContent = lines.length
    ? "const NOTES = {\n" + lines.join("\n") + "\n};"
    : "적어 둔 메모가 없다. 문항의 [메모] 버튼을 눌러 먼저 작성한다.";
  box.hidden = false;
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
});

document.getElementById("copy").addEventListener("click", async () => {
  const text = document.getElementById("exportcode").textContent;
  try {
    await navigator.clipboard.writeText(text);
    alert("복사했다. 파일의 NOTES 자리에 붙여넣으면 된다.");
  } catch {
    alert("자동 복사가 막혀 있다. 블록을 직접 선택해 복사한다.");
  }
});

/* ─────────────────────────────────────────────
   4) 필터 — 언어와 단원을 함께 건다
   ───────────────────────────────────────────── */
const pick = { source: "전체", lang: "전체", unit: "전체", wrong: false };

function makeChips(box, values, key){
  box.innerHTML = "";
  values.forEach(v => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.type = "button";
    chip.textContent = v;
    chip.dataset.value = v;
    chip.setAttribute("aria-pressed", String(pick[key] === v));
    chip.addEventListener("click", () => { pick[key] = v; applyFilter(); });
    box.appendChild(chip);
  });
}

const srcBox  = document.getElementById("filters-source");
const langBox = document.getElementById("filters-lang");
const unitBox = document.getElementById("filters-unit");
const ALL_SRCS  = ["전체", ...new Set(PROBLEMS.map(p => p.source))];
const ALL_LANGS = ["전체", ...new Set(PROBLEMS.map(p => p.lang))];
const ALL_UNITS = ["전체", ...new Set(PROBLEMS.map(p => p.unit))];

function applyFilter(){
  // 선택한 언어에 문항이 없는 단원은 칩에서 감춘다
  const inScope = PROBLEMS.filter(p =>
    (pick.source === "전체" || p.source === pick.source) &&
    (pick.lang === "전체" || p.lang === pick.lang));
  const units = ["전체", ...new Set(inScope.map(p => p.unit))];
  if (!units.includes(pick.unit)) pick.unit = "전체";

  makeChips(srcBox,  ALL_SRCS,  "source");
  makeChips(langBox, ALL_LANGS, "lang");
  makeChips(unitBox, units, "unit");

  document.querySelectorAll(".q").forEach(sec => {
    const ok = (pick.source === "전체" || sec.dataset.source === pick.source)
            && (pick.lang === "전체" || sec.dataset.lang === pick.lang)
            && (pick.unit === "전체" || sec.dataset.unit === pick.unit)
            && (!pick.wrong || wrongSet.has(sec.dataset.id));
    sec.style.display = ok ? "" : "none";
  });
}
applyFilter();

document.getElementById("reset").addEventListener("click", () => {
  state.clear();
  wrongSet.clear();
  pick.wrong = false;
  btnWrong.setAttribute("aria-pressed", "false");
  applyFilter();
  document.querySelectorAll('[data-act="retry"]').forEach(b => {
    if (!b.disabled) b.click();
  });
  updateScore();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>
</body>
