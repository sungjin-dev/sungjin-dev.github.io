<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280">
<title>SungJin Park GitHub Profile Banner</title>
<desc>터미널 창 스타일의 헤더, 그라데이션 이름 타이틀, 타이핑 커서, 스캔하는 카메라 렌즈 모티프로 구성된 다크 테마 프로필 배너</desc>

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d1117"/>
    <stop offset="55%" stop-color="#161b33"/>
    <stop offset="100%" stop-color="#1a1b3a"/>
  </linearGradient>
  <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7aa2f7"/>
    <stop offset="55%" stop-color="#bb9af7"/>
    <stop offset="100%" stop-color="#73daca"/>
  </linearGradient>
  <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
  </radialGradient>
  <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="28"/>
  </filter>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#7aa2f7" opacity="0.14"/>
  </pattern>
  <clipPath id="lensClip">
    <circle cx="860" cy="158" r="62"/>
  </clipPath>
</defs>

<!-- background -->
<rect x="0" y="0" width="1000" height="280" fill="url(#bgGrad)"/>
<rect x="0" y="36" width="1000" height="244" fill="url(#dots)"/>

<!-- glow accents -->
<circle cx="140" cy="210" r="140" fill="url(#glowBlue)" filter="url(#blurSoft)"/>
<circle cx="860" cy="120" r="160" fill="url(#glowPurple)" filter="url(#blurSoft)"/>

<!-- bottom wave layers -->
<path d="M0,238 C150,208 300,258 500,233 C700,208 850,248 1000,223 L1000,280 L0,280 Z" fill="#12142a" opacity="0.85"/>
<path d="M0,258 C200,233 400,268 600,248 C800,230 900,258 1000,246 L1000,280 L0,280 Z" fill="#0d0f1f" opacity="0.9"/>

<!-- terminal top bar -->
<rect x="0" y="0" width="1000" height="36" fill="#11121f"/>
<line x1="0" y1="36" x2="1000" y2="36" stroke="#282a44" stroke-width="1"/>
<circle cx="24" cy="18" r="6" fill="#f7768e"/>
<circle cx="46" cy="18" r="6" fill="#e0af68"/>
<circle cx="68" cy="18" r="6" fill="#9ece6a"/>
<text x="94" y="23" font-family="ui-monospace,'Cascadia Code','Fira Code',monospace" font-size="13" fill="#565f89">sungjin-dev — profile.svg</text>

<!-- lens / computer-vision motif -->
<g stroke-linecap="round">
  <path d="M782,102 L782,80 L804,80" fill="none" stroke="#7aa2f7" stroke-width="2.5"/>
  <path d="M916,80 L938,80 L938,102" fill="none" stroke="#7aa2f7" stroke-width="2.5"/>
  <path d="M782,214 L782,236 L804,236" fill="none" stroke="#7aa2f7" stroke-width="2.5"/>
  <path d="M916,236 L938,236 L938,214" fill="none" stroke="#7aa2f7" stroke-width="2.5"/>
</g>

<circle cx="860" cy="158" r="62" fill="none" stroke="#3b4261" stroke-width="1.5" opacity="0.9"/>
<circle cx="860" cy="158" r="46" fill="none" stroke="#7aa2f7" stroke-width="1.5" opacity="0.6"/>
<circle cx="860" cy="158" r="30" fill="none" stroke="#bb9af7" stroke-width="1.5" opacity="0.7"/>
<circle cx="860" cy="158" r="6" fill="#73daca"/>

<g stroke="#565f89" stroke-width="1.5" stroke-linecap="round">
  <line x1="860" y1="112" x2="860" y2="128" transform="rotate(0,860,158)"/>
  <line x1="860" y1="112" x2="860" y2="128" transform="rotate(60,860,158)"/>
  <line x1="860" y1="112" x2="860" y2="128" transform="rotate(120,860,158)"/>
  <line x1="860" y1="112" x2="860" y2="128" transform="rotate(180,860,158)"/>
  <line x1="860" y1="112" x2="860" y2="128" transform="rotate(240,860,158)"/>
  <line x1="860" y1="112" x2="860" y2="128" transform="rotate(300,860,158)"/>
</g>

<g clip-path="url(#lensClip)">
  <rect x="798" y="96" width="124" height="3" fill="#73daca">
    <animate attributeName="y" values="96;220;96" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.85;0" dur="3s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- title block -->
<text x="60" y="150" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="url(#textGrad)">SungJin Park</text>

<text x="62" y="190" font-family="ui-monospace,'Cascadia Code','Fira Code',monospace" font-size="20" fill="#7dcfff">// Dev &amp; Computer Vision Enthusiast</text>

<rect x="500" y="174" width="11" height="22" fill="#7dcfff">
  <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" calcMode="discrete"/>
</rect>

</svg>
