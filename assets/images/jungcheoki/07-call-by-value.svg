<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" width="100%" role="img" aria-label="C언어의 주소 전달과 값 전달에서 원본 변수가 바뀌는지 비교">
<style>
  text{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;fill:#2b2b28}
  .t{font-size:13.5px;font-weight:600}
  .bg{fill:#ffffff}
  .g{fill:#6b6b66}
  .box{fill:#f3f3f0;stroke:#9a9a93;stroke-width:1}
  .ok{fill:#e4f2e8;stroke:#3d8c55;stroke-width:1.2}
  .hot{fill:#fbe8e2;stroke:#c4533a;stroke-width:1.2}
  .panel{fill:none;stroke:#b8b8b0;stroke-width:1}
  .ln{stroke:#6b6b66;stroke-width:1.2;fill:none}
  .lnok{stroke:#3d8c55;stroke-width:1.4;fill:none}
  .mk{fill:#6b6b66}
  .mkok{fill:#3d8c55}
  .tok{fill:#2c7545}
  .thot{fill:#b0432d}
  @media (prefers-color-scheme: dark){
    text{fill:#e8e8e3}
    .bg{fill:#1c1c1a}
    .g{fill:#a3a39c}
    .box{fill:#2b2b29;stroke:#7d7d76}
    .ok{fill:#1e3a29;stroke:#6dbd86}
    .hot{fill:#4a2b23;stroke:#ea8c76}
    .panel{stroke:#5a5a55}
    .ln{stroke:#a3a39c}
    .lnok{stroke:#6dbd86}
    .mk{fill:#a3a39c}
    .mkok{fill:#6dbd86}
    .tok{fill:#7fd09a}
    .thot{fill:#f0a08c}
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" class="mk"/></marker>
  <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" class="mkok"/></marker>
</defs>
<rect class="bg" width="680" height="236"/>
<text class="t" x="16" y="24">값 전달과 주소 전달 : 원본이 바뀌는가</text>

<rect class="panel" x="16" y="38" width="316" height="134" rx="6"/>
<text class="t" x="32" y="62">func1(&amp;i) : 주소 전달</text>
<text class="g" x="32" y="92">func1의 p (int *)</text>
<rect class="box" x="32" y="100" width="84" height="30" rx="3"/>
<text x="74" y="120" text-anchor="middle">100</text>
<text class="g" x="74" y="148" text-anchor="middle">주소 1000</text>
<line class="lnok" x1="116" y1="115" x2="204" y2="115" marker-end="url(#aho)"/>
<text class="tok" x="160" y="108" text-anchor="middle">*p = 50</text>
<text class="g" x="254" y="92" text-anchor="middle">main의 i</text>
<rect class="ok" x="206" y="100" width="96" height="30" rx="3"/>
<text x="254" y="120" text-anchor="middle">10 → 50</text>
<text class="g" x="254" y="148" text-anchor="middle">주소 100</text>
<text class="tok" x="32" y="164">p가 가리키는 원본을 직접 바꾼다</text>

<rect class="panel" x="348" y="38" width="316" height="134" rx="6"/>
<text class="t" x="364" y="62">func2(i) : 값 전달</text>
<text class="g" x="412" y="92" text-anchor="middle">main의 i</text>
<rect class="box" x="364" y="100" width="96" height="30" rx="3"/>
<text x="412" y="120" text-anchor="middle">10</text>
<text class="g" x="412" y="148" text-anchor="middle">주소 100</text>
<line class="ln" x1="460" y1="115" x2="546" y2="115" marker-end="url(#ah)"/>
<text class="g" x="503" y="108" text-anchor="middle">값 복사</text>
<text class="g" x="596" y="92" text-anchor="middle">func2의 p (int)</text>
<rect class="hot" x="548" y="100" width="96" height="30" rx="3"/>
<text x="596" y="120" text-anchor="middle">10 → 60</text>
<text class="g" x="596" y="148" text-anchor="middle">주소 200</text>
<text class="thot" x="364" y="164">복사본만 바뀌고 원본은 그대로다</text>

<rect class="box" x="16" y="186" width="648" height="34" rx="4"/>
<text x="340" y="208" text-anchor="middle">출력 결과: 50 10  (func1 후 i = 50, 재초기화한 i는 func2 후에도 10)</text>
</svg>
