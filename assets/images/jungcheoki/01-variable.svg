<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 184" width="100%" role="img" aria-label="변수 선언과 초기화를 상자 그림으로 표현">
<style>
  text{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;fill:#2b2b28}
  .t{font-size:13.5px;font-weight:600}
  .bg{fill:#ffffff}
  .g{fill:#6b6b66}
  .box{fill:#f3f3f0;stroke:#9a9a93;stroke-width:1}
  .ok{fill:#e4f2e8;stroke:#3d8c55;stroke-width:1.2}
  .hot{fill:#fbe8e2;stroke:#c4533a;stroke-width:1.2}
  .panel{fill:none;stroke:#b8b8b0;stroke-width:1}
  .tok{fill:#2c7545}
  .thot{fill:#b0432d}
  @media (prefers-color-scheme: dark){
    text{fill:#e8e8e3}
    .bg{fill:#1c1c1a}
    .g{fill:#a3a39c}
    .box{fill:#2b2b29;stroke:#7d7d76}
    .ok{fill:#1e3a29;stroke:#6dbd86}
    .hot{fill:#4a2b23;stroke:#ea8c76}
    .panel{stroke:#5a5a55}
    .tok{fill:#7fd09a}
    .thot{fill:#f0a08c}
  }
</style>
<rect class="bg" width="680" height="184"/>
<text class="t" x="16" y="24">변수 = 이름과 주소가 있는 빈 상자</text>

<rect class="panel" x="16" y="38" width="316" height="132" rx="6"/>
<text class="t" x="32" y="62">선언: 상자만 준비한다</text>
<text x="32" y="122">int blog;</text>
<text x="244" y="90" text-anchor="middle">int blog</text>
<rect class="box" x="194" y="98" width="100" height="40" rx="3"/>
<text x="244" y="123" text-anchor="middle">?</text>
<text class="g" x="244" y="156" text-anchor="middle">주소 100</text>
<text class="g" x="32" y="156">값이 정해지지 않은 상태</text>

<rect class="panel" x="348" y="38" width="316" height="132" rx="6"/>
<text class="t" x="364" y="62">초기화: 처음 값을 넣는다</text>
<text x="364" y="122">int blog = 1;</text>
<text x="576" y="90" text-anchor="middle">int blog</text>
<rect class="ok" x="526" y="98" width="100" height="40" rx="3"/>
<text x="576" y="123" text-anchor="middle">1</text>
<text class="g" x="576" y="156" text-anchor="middle">주소 100</text>
<text class="tok" x="364" y="156">최초 대입이지 reset이 아님</text>
</svg>
